<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winkel">

<title>Winkel und Dreiecke</title>
<style>
:root{--bg:#f4f3ee;--card:#fff;--fg:#1d2330;--mut:#8a90a0;--line:#dcdbd4;--c1:#3b82f6;--c2:#f59e0b;--c3:#10b981;--c4:#ec4899;--ok:#16a34a;--bad:#dc2626;--star:#f5b301}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1f242d;--fg:#e8eaf0;--mut:#8b93a5;--line:#333a47;--ok:#34d399;--bad:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 12px calc(24px + env(safe-area-inset-bottom));max-width:580px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 0}
header h1{font-size:18px;margin:0;flex:1}
#total{font-weight:700;color:var(--star);white-space:nowrap}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
#back{width:44px;height:44px;font-size:24px;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.lv{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:6px;text-align:left}
.lv small{display:block;color:var(--mut);font-size:13px}
.st{color:var(--star);font-size:20px;letter-spacing:2px}
#lvl{color:var(--mut);font-size:14px}
#dots{display:flex;gap:6px;margin:8px 0 10px}
#dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
#dots i.on{background:var(--ok)}
#text{font-size:18px;font-weight:600;min-height:50px}
#fig{display:block;width:100%;aspect-ratio:4/3;background:var(--card);border:1px solid var(--line);border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#read{min-height:24px;margin:8px 2px;font-variant-numeric:tabular-nums}
.msg{min-height:44px;margin:8px 2px;font-weight:600}
.msg.good{color:var(--ok)}.msg.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{font-size:18px}
.chip.act{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font-size:22px;padding:12px 0}
.go{background:var(--c1);border-color:var(--c1);color:#fff;font-weight:700}
.wide{width:100%;font-size:18px;padding:14px}
.opt{display:block;width:100%;margin-bottom:8px;font-size:17px;text-align:left;padding:14px}
.opt.off{opacity:.4;text-decoration:line-through}
.opt.yes{border-color:var(--ok);color:var(--ok);font-weight:700}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools .act{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1);font-weight:700}
#next{margin-top:6px;background:var(--ok);border-color:var(--ok)}
#fin{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
#fin .box{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:360px;text-align:center}
#fst{font-size:56px;color:var(--star);letter-spacing:6px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
#fin button{display:block;width:100%;margin-top:8px}
svg .ln{stroke:var(--fg);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .fa{stroke:var(--mut);stroke-width:1.5;fill:none}
svg .da{stroke:var(--mut);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
svg .hi{stroke:var(--ok);stroke-width:2.5;fill:none}
svg .hs{stroke:var(--c1);stroke-width:5;fill:none;stroke-linecap:round}
svg .cc{stroke:var(--c1);stroke-width:2;fill:none}
svg .cs{stroke:var(--c2);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
svg .wd{stroke:none;opacity:.55}
svg .c0{fill:var(--mut);opacity:.22}svg .c1{fill:var(--c1)}svg .c2{fill:var(--c2)}svg .c3{fill:var(--c3)}svg .c4{fill:var(--c4)}
svg .pt{fill:var(--fg)}svg .mk{fill:var(--ok)}
svg .hd{fill:var(--c1);opacity:.25}svg .hd2{fill:var(--c1)}
svg .ip{fill:var(--c4)}
svg .tx{fill:var(--fg);font:600 14px system-ui,sans-serif}
svg .ts{fill:var(--mut);font:500 13px system-ui,sans-serif}
svg .tg{fill:var(--c4)}
svg .gw{fill:var(--bad);fill-opacity:.16;stroke:var(--bad);stroke-width:2;stroke-dasharray:5 4}
svg .sel{fill:none;stroke:var(--c1);stroke-width:3}
.pr{margin:0 0 8px;color:var(--mut)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.cards button{font-size:17px;padding:12px 8px}
.hl{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:17px;padding:2px 0}
.hl small{color:var(--mut);font-weight:500;font-size:14px;text-align:right}
</style>
</head>
<body>
<header><button id="back" hidden aria-label="Zurück">‹</button><h1>Winkel und Dreiecke</h1><span id="total"></span></header>
<main id="home"></main>
<main id="game" hidden>
  <div id="lvl"></div>
  <div id="dots"></div>
  <div id="text"></div>
  <svg id="fig" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="read"></div>
  <div id="ctl"></div>
  <div id="msg" class="msg"></div>
  <button id="next" class="go wide" hidden>Weiter</button>
</main>
<div id="fin" hidden><div class="box">
  <div id="fst"></div><p id="ftx"></p>
  <button id="fnext" class="go">Nächstes Level</button>
  <button id="fagain">Nochmal</button>
  <button id="fhome">Übersicht</button>
</div></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const P = (x, y) => ({ x, y });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
// Winkel werden mathematisch gezählt (gegen den Uhrzeigersinn, y nach oben).
const dir = (p, q) => (deg(Math.atan2(-(q.y - p.y), q.x - p.x)) + 360) % 360;
const polar = (p, r, a) => P(p.x + r * Math.cos(rad(a)), p.y - r * Math.sin(rad(a)));
const PX = 30; // 1 cm
const mm = px => Math.round(px / 3);
const cm = px => (mm(px) / 10).toFixed(1).replace('.', ',');
const f = n => n.toFixed(1);

// ---------- Zeichnen ----------
const line = (a, b, c = 'ln') => `<line class="${c}" x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}"/>`;
const circ = (m, r, c = 'ln') => `<circle class="${c}" cx="${f(m.x)}" cy="${f(m.y)}" r="${f(r)}"/>`;
const dot = (p, c = 'pt') => `<circle class="${c}" cx="${f(p.x)}" cy="${f(p.y)}" r="4"/>`;
const handle = p => `<circle class="hd" cx="${f(p.x)}" cy="${f(p.y)}" r="15"/><circle class="hd2" cx="${f(p.x)}" cy="${f(p.y)}" r="6"/>`;
const txt = (p, s, c = 'tx') => `<text class="${c}" x="${f(p.x)}" y="${f(p.y)}" text-anchor="middle" dominant-baseline="central">${s}</text>`;
const poly = (ps, c = 'ln') => `<polygon class="${c}" points="${ps.map(p => f(p.x) + ',' + f(p.y)).join(' ')}"/>`;
function wedge(v, a1, a2, r, c, label) {
  const d = ((a2 - a1) % 360 + 360) % 360;
  const p1 = polar(v, r, a1), p2 = polar(v, r, a1 + d);
  let s = `<path class="wd ${c}" d="M${f(v.x)} ${f(v.y)}L${f(p1.x)} ${f(p1.y)}A${r} ${r} 0 ${d > 180 ? 1 : 0} 0 ${f(p2.x)} ${f(p2.y)}Z"/>`;
  if (label) {
    const k = 6 + 3.2 * String(label).length;
    const lr = Math.min(120, Math.max(r + 14, k / Math.sin(rad(Math.max(d, 10) / 2))));
    s += txt(polar(v, lr, a1 + d / 2), label);
  }
  return s;
}
function inner(v, p, q, r, c, label) {
  let a1 = dir(v, p), a2 = dir(v, q);
  if (((a2 - a1) % 360 + 360) % 360 > 180) [a1, a2] = [a2, a1];
  return wedge(v, a1, a2, r, c, label);
}
const angleAt = (v, p, q) => { const d = Math.abs(dir(v, p) - dir(v, q)); return d > 180 ? 360 - d : d; };
const cen = ps => P(ps.reduce((s, p) => s + p.x, 0) / ps.length, ps.reduce((s, p) => s + p.y, 0) / ps.length);
const out = (p, c, d = 15) => { const l = dist(p, c) || 1; return P(p.x + (p.x - c.x) / l * d, p.y + (p.y - c.y) / l * d); };
function fit(pts, x0, y0, x1, y1) {
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const a = Math.min(...xs), b = Math.max(...xs), c = Math.min(...ys), d = Math.max(...ys);
  const s = Math.min((x1 - x0) / (b - a), (y1 - y0) / (d - c));
  const ox = (x0 + x1) / 2 - s * (a + b) / 2, oy = (y0 + y1) / 2 - s * (c + d) / 2;
  return pts.map(p => P(ox + s * p.x, oy + s * p.y));
}
function tri(al, be, box) {
  const b = Math.sin(rad(be)) / Math.sin(rad(180 - al - be));
  return fit([P(0, 0), P(1, 0), P(b * Math.cos(rad(al)), -b * Math.sin(rad(al)))], ...box);
}
function isect(p, u, q, v) {
  const det = u.x * v.y - u.y * v.x; if (Math.abs(det) < 1e-9) return null;
  const dx = q.x - p.x, dy = q.y - p.y;
  const t = (dx * v.y - dy * v.x) / det, s = (dx * u.y - dy * u.x) / det;
  return { t, s, pt: P(p.x + t * u.x, p.y + t * u.y) };
}
function ccenter(A, B, C) {
  const d = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
  const a2 = A.x * A.x + A.y * A.y, b2 = B.x * B.x + B.y * B.y, c2 = C.x * C.x + C.y * C.y;
  return P((a2 * (B.y - C.y) + b2 * (C.y - A.y) + c2 * (A.y - B.y)) / d, (a2 * (C.x - B.x) + b2 * (A.x - C.x) + c2 * (B.x - A.x)) / d);
}
function icenter(A, B, C) {
  const a = dist(B, C), b = dist(A, C), c = dist(A, B), s = a + b + c;
  return P((a * A.x + b * B.x + c * C.x) / s, (a * A.y + b * B.y + c * C.y) / s);
}
const dline = (p, a, b) => Math.abs((b.x - a.x) * (a.y - p.y) - (a.x - p.x) * (b.y - a.y)) / dist(a, b);
function foot(p, a, b) {
  const l = dist(a, b), ux = (b.x - a.x) / l, uy = (b.y - a.y) / l, t = (p.x - a.x) * ux + (p.y - a.y) * uy;
  return P(a.x + t * ux, a.y + t * uy);
}
const lab = (T, n, v) => { const fl = T.fields.find(x => x.name === n); return fl ? `${n}=${fl.val ? fl.val + '°' : '?'}` : `${n}=${v}°`; };
// Winkelbeschriftung außen an der Ecke, damit sie auch bei spitzen Winkeln lesbar bleibt.
const olab = (p, c, s) => {
  const l = dist(p, c) || 1, ux = (p.x - c.x) / l, uy = (p.y - c.y) / l, d = 14 + 4 * s.length * Math.abs(ux);
  return txt(P(Math.max(28, Math.min(372, p.x + ux * d)), Math.max(10, Math.min(290, p.y + uy * d))), s);
};
const strip = (m, angs, cls, r) => { let a = 0, s = ''; angs.forEach((w, i) => { s += wedge(m, a, a + w, r, cls[i]); a += w; }); return s; };
const queue = (G, arr) => { if (!G.q || !G.q.length) G.q = shuffle(arr); return G.q.pop(); };
const acute = () => { let al, be; do { al = rnd(50, 75); be = rnd(50, 75); } while (180 - al - be < 45); return tri(al, be, [110, 90, 290, 230]); };

// ---------- 1 Winkel an Kreuzungen ----------
const GR = { al: 'α', be: 'β', ga: 'γ', de: 'δ' }, KEYS = ['al', 'be', 'ga', 'de'];
// ---------- 2 Innenwinkelsumme ----------
function triAngles() { let al, be, ga; do { al = rnd(6, 16) * 5; be = rnd(6, 16) * 5; ga = 180 - al - be; } while (ga < 30); return [al, be, ga]; }
function quadGen() {
  for (let i = 0; i < 300; i++) {
    const al = rnd(12, 24) * 5, be = rnd(12, 24) * 5, ga = rnd(12, 24) * 5, de = 360 - al - be - ga;
    if (de < 50 || de > 130) continue;
    const p = 0.6 + Math.random() * 0.5, A = P(0, 0), B = P(1, 0), D = P(p * Math.cos(rad(al)), p * Math.sin(rad(al)));
    const db = 180 - be, dd = al + 180 + de;
    const r = isect(B, P(Math.cos(rad(db)), Math.sin(rad(db))), D, P(Math.cos(rad(dd)), Math.sin(rad(dd))));
    if (!r || r.t < 0.35 || r.s < 0.35 || r.t > 2 || r.s > 2) continue;
    return { ang: [al, be, ga, de], pts: [A, B, r.pt, D].map(q => P(q.x, -q.y)) };
  }
  return { ang: [90, 90, 90, 90], pts: [P(0, 0), P(1.4, 0), P(1.4, -1), P(0, -1)] };
}
// ---------- 3 Mittelsenkrechte und Winkelhalbierende ----------
function msDrag() {
  const th = rnd(-25, 25), h = rnd(60, 90), M = P(200, 165), A = polar(M, h, 180 + th), B = polar(M, h, th);
  const u = P((B.x - A.x) / (2 * h), (B.y - A.y) / (2 * h));
  const off = p => (p.x - M.x) * u.x + (p.y - M.y) * u.y;
  return {
    sig: th + ',' + h, type: 'drag', btn: 'Punkt setzen', marks: [], pts: { P: P(105, 60) },
    text: 'Finde drei verschiedene Stellen, an denen P von A und B gleich weit weg ist.',
    explain: 'Alle diese Punkte liegen auf einer Geraden. Sie heißt Mittelsenkrechte und geht senkrecht durch die Mitte von AB.',
    move(T, n, p) { const o = off(p); if (Math.abs(o) < 6) { p.x -= o * u.x; p.y -= o * u.y; } T.pts.P = p; },
    read(T) { return `P bis A: <b>${cm(dist(T.pts.P, A))} cm</b> · P bis B: <b>${cm(dist(T.pts.P, B))} cm</b>`; },
    check(T) {
      const p = T.pts.P;
      if (mm(dist(p, A)) !== mm(dist(p, B))) return { msg: 'P ist noch nicht gleich weit von A und B weg.' };
      if (T.marks.some(m => dist(m, p) < 30)) return { more: true, msg: 'Hier in der Nähe liegt schon ein Punkt. Such eine andere Stelle.' };
      T.marks.push(P(p.x, p.y));
      return T.marks.length < 3 ? { more: true, msg: `Gefunden! Noch ${3 - T.marks.length}.` } : { ok: true };
    },
    draw(T) {
      const p = T.pts.P; let s = '';
      if (T.ok) s += line(P(M.x + 400 * u.y, M.y - 400 * u.x), P(M.x - 400 * u.y, M.y + 400 * u.x), 'hi');
      else s += line(p, A, 'da') + line(p, B, 'da');
      s += line(A, B) + dot(A) + dot(B) + txt(P(A.x - 6, A.y + 18), 'A') + txt(P(B.x + 6, B.y + 18), 'B');
      T.marks.forEach(m => { s += dot(m, 'mk'); });
      return s + (T.ok ? '' : handle(p) + txt(P(p.x + 22, p.y - 14), 'P'));
    }
  };
}
function whDrag() {
  const w = rnd(20, 38) * 2, S = P(50, 255), e2 = P(Math.cos(rad(w)), -Math.sin(rad(w))), b = P(Math.cos(rad(w / 2)), -Math.sin(rad(w / 2)));
  const along = p => (p.x - S.x) * b.x + (p.y - S.y) * b.y, perp = p => (p.x - S.x) * b.y - (p.y - S.y) * b.x;
  const d1 = p => Math.abs(p.y - S.y), d2 = p => Math.abs((p.x - S.x) * e2.y - (p.y - S.y) * e2.x);
  return {
    sig: w, type: 'drag', btn: 'Punkt setzen', marks: [], pts: { P: polar(S, 210, w * 0.25) },
    text: 'Finde drei verschiedene Stellen, an denen P von beiden Schenkeln gleich weit weg ist.',
    explain: 'Alle diese Punkte liegen auf der Winkelhalbierenden. Sie teilt den Winkel in zwei gleich große Teile.',
    move(T, n, p) { p.y = Math.min(p.y, S.y - 4); const a = along(p); if (Math.abs(perp(p)) < 6 && a > 30) p = P(S.x + a * b.x, S.y + a * b.y); T.pts.P = p; },
    read(T) { return `Abstand zum unteren Schenkel: <b>${cm(d1(T.pts.P))} cm</b> · zum oberen: <b>${cm(d2(T.pts.P))} cm</b>`; },
    check(T) {
      const p = T.pts.P;
      if (mm(d1(p)) !== mm(d2(p)) || along(p) < 30 || Math.abs(perp(p)) > 12) return { msg: 'P ist noch nicht gleich weit von beiden Schenkeln weg.' };
      if (T.marks.some(m => dist(m, p) < 30)) return { more: true, msg: 'Hier in der Nähe liegt schon ein Punkt. Such eine andere Stelle.' };
      T.marks.push(P(p.x, p.y));
      return T.marks.length < 3 ? { more: true, msg: `Gefunden! Noch ${3 - T.marks.length}.` } : { ok: true };
    },
    draw(T) {
      const p = T.pts.P; let s = '';
      if (T.ok) s += wedge(S, 0, w / 2, 60, 'c1', w / 2 + '°') + wedge(S, w / 2, w, 60, 'c2', w / 2 + '°') + line(S, polar(S, 400, w / 2), 'hi');
      else { const t = (p.x - S.x) * e2.x + (p.y - S.y) * e2.y; s += line(p, P(p.x, S.y), 'da') + line(p, P(S.x + t * e2.x, S.y + t * e2.y), 'da'); }
      s += line(S, polar(S, 340, 0)) + line(S, polar(S, 340, w));
      T.marks.forEach(m => { s += dot(m, 'mk'); });
      return s + (T.ok ? '' : handle(p) + txt(P(p.x + 22, p.y - 14), 'P'));
    }
  };
}
function midNum(G) {
  const kind = queue(G, ['a', 'b', 'c', 'd', 'e']);
  const A = P(80, 210), B = P(320, 210), M = P(200, 210), Q = P(200, 90);
  const seg = extra => line(P(200, 40), P(200, 275), 'hi') + line(A, B) + dot(A) + dot(B) + dot(M) + txt(P(A.x, A.y + 18), 'A') + txt(P(B.x, B.y + 18), 'B') + txt(P(M.x + 14, M.y + 18), 'M') + extra;
  const sq = `<path class="fa" d="M200 196H214V210"/>`;
  if (kind === 'a' || kind === 'b') {
    const W = rnd(4, 14) * 10, S = P(140, 250);
    const fig = l => wedge(S, 0, W / 2, 55, 'c1', l) + wedge(S, W / 2, W, 55, 'c2') + line(S, polar(S, 190, 0)) + line(S, polar(S, 190, W)) + line(S, polar(S, 215, W / 2), 'hi');

// ---------- Begründen: Winkel aus Beziehungen ----------
// Eine Figur hat Ecken mit Strahlen. Ein Winkel liegt an einer Ecke, gegen den Uhrzeigersinn von Strahl a1 bis a2.

const save = () => { try { localStorage.setItem('geo-sterne-2', JSON.stringify(S)); } catch (e) {} };
const stars = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const say = (m, c) => { G.msg = m; G.mc = c; };

function home() {
  G = null; $('game').hidden = true; $('fin').hidden = true; $('home').hidden = false; $('back').hidden = true;
  $('home').innerHTML = TOPICS.map((tp, t) => `<section class="card"><h2>${t + 1}. ${tp.name}</h2>` + tp.levels.map((lv, l) =>
    `<button class="lv" data-t="${t}" data-l="${l}"><span>Level ${l + 1}<small>${lv.name}</small></span><span class="st">${stars(S[t + '.' + l] || 0)}</span></button>`).join('') + '</section>').join('');
  total();
}
function total() {
  let sum = 0; for (const k in S) sum += S[k] || 0;
  $('total').textContent = `★ ${sum}/${TOPICS.reduce((n, tp) => n + tp.levels.length * 3, 0)}`;
}
function start(t, l) {
  G = { t, l, solved: 0, mistakes: 0, af: 0, msg: '', mc: '', run: [] };
  $('home').hidden = true; $('fin').hidden = true; $('game').hidden = false; $('back').hidden = false;
  next();
}
function next() {
  const L = TOPICS[G.t].levels[G.l];
  if (G.solved >= L.need) return finish();
  const k = G.t + '.' + G.l; let seen = SEEN[k] || (SEEN[k] = new Set()), T, n = 0;
  do T = L.gen(G); while (seen.has(T.sig) && ++n < 200);
  if (seen.has(T.sig)) { seen = SEEN[k] = new Set(G.run); n = 0; do T = L.gen(G); while (seen.has(T.sig) && ++n < 200); }
  seen.add(T.sig); G.run.push(T.sig);
  G.T = T; G.af = 0; say('', ''); render(); window.scrollTo(0, 0);
}
function redraw() {
  const T = G.T;
  $('fig').innerHTML = T.draw(T);
  $('read').innerHTML = T.read ? T.read(T) : '';
}
function render() {
  const T = G.T, tp = TOPICS[G.t], L = tp.levels[G.l];
  $('lvl').textContent = `${tp.name} · Level ${G.l + 1}`;
  $('dots').innerHTML = Array.from({ length: L.need }, (_, i) => `<i class="${i < G.solved ? 'on' : ''}"></i>`).join('');
  $('text').innerHTML = T.text;
  redraw();
  let h = '';
  if (T.type === 'num') {
    h += '<div class="chips">' + T.fields.map((x, i) => `<button class="chip${i === G.af && !T.ok ? ' act' : ''}${x.bad ? ' bad' : ''}" data-f="${i}">${x.name} = <b>${x.val || '?'}</b> ${x.unit}</button>`).join('') + '</div>';
    if (!T.ok) h += '<div class="pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-d="${d}">${d}</button>`).join('') + '<button data-d="x">⌫</button><button data-d="0">0</button><button class="go" data-go="1">Prüfen</button></div>';
  } else if (T.type === 'choice') {
    h += T.opts.map((o, i) => `<button class="opt${T.off[i] ? ' off' : ''}${T.ok && i === T.right ? ' yes' : ''}" data-o="${i}"${T.off[i] || T.ok ? ' disabled' : ''}>${o}</button>`).join('');
  } else if (T.type === 'steps') {
    h += T.order.map(i => { const d = T.done.includes(i); return `<button class="opt${d ? ' yes' : ''}" data-s="${i}"${d ? ' disabled' : ''}>${d ? (T.done.indexOf(i) + 1) + '. ' : ''}${T.steps[i].t}</button>`; }).join('');
  } else if (T.type === 'proof') {
    if (!T.ok) {
      const tn = T.sel ? T.F.A[T.sel.t].name : '';
      if (T.ph === 't') h += '<p class="pr">Tippe einen Winkel an, den du ausrechnen willst.</p>';
      if (T.ph === 'c') h += `<p class="pr">Wie hängt ${tn} mit einem bekannten Winkel zusammen?</p><div class="cards">` + T.cards.map(c => `<button data-card="${c}">${CARDS[c]}</button>`).join('') + '</div>';
      if (T.ph === 'v') h += `<div class="chips"><span class="chip act">${tn} = <b>${T.val || '?'}</b>°</span></div><div class="pad">` + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-d="${d}">${d}</button>`).join('') + '<button data-d="x">⌫</button><button data-d="0">0</button><button class="go" data-go="1">Prüfen</button></div>';
      h += '<div class="cards"><button data-tip="1">Tipp</button></div>';
    }
  } else if (T.type === 'con') {
    if (!T.ok) h += `<div class="tools"><button data-tool="c"${T.tool === 'c' ? ' class="act"' : ''}>Zirkel</button><button data-tool="l"${T.tool === 'l' ? ' class="act"' : ''}>Lineal</button><button data-undo="1">Zurück</button><button data-tip="1">Tipp</button></div>`;
  } else if (!T.ok) h += `<button class="go wide" data-go="1">${T.btn || 'Prüfen'}</button>`;
  $('ctl').innerHTML = h;
  $('msg').textContent = G.msg; $('msg').className = 'msg ' + G.mc;
  $('next').hidden = !T.ok;
}
function win() { const T = G.T; T.ok = true; G.solved++; say('Richtig! ' + (T.explain || ''), 'good'); render(); }
function miss(m) { G.mistakes++; say(m, 'bad'); render(); }
function go() {
  const T = G.T; if (T.ok) return;
  if (T.type === 'proof') return proofGo(T);
  if (T.type === 'num') {
    if (T.fields.some(x => !x.val)) { say('Trag erst alle Werte ein.', ''); return render(); }
    let all = true; T.fields.forEach(x => { x.bad = parseInt(x.val, 10) !== x.ans; if (x.bad) all = false; });
    return all ? win() : miss('Das stimmt noch nicht. ' + (T.tip || ''));
  }
  const r = T.check(T);
  if (r.ok) return win();
  if (r.more) { say(r.msg, 'good'); return render(); }
  miss(r.msg);
}
function key(d) {
  const T = G.T; if (T.ok) return;
  if (T.type === 'proof') { if (T.ph !== 'v') return; T.val = d === 'x' ? T.val.slice(0, -1) : T.val.length < 3 ? (T.val === '0' ? '' : T.val) + d : T.val; return render(); }
  if (T.type !== 'num') return;
  const x = T.fields[G.af]; x.bad = false;
  if (d === 'x') x.val = x.val.slice(0, -1); else if (x.val.length < 3) x.val = (x.val === '0' ? '' : x.val) + d;
  render();
}
function finish() {
  const n = G.mistakes === 0 ? 3 : G.mistakes <= 2 ? 2 : 1, k = G.t + '.' + G.l;
  if (n > (S[k] || 0)) { S[k] = n; save(); }
  total();
  $('fst').textContent = stars(n);
  $('ftx').textContent = ['', 'Geschafft! Für mehr Sterne brauchst du weniger Fehler.', 'Stark, fast ohne Fehler!', 'Perfekt, kein einziger Fehler!'][n];
  $('fnext').hidden = G.l >= TOPICS[G.t].levels.length - 1;
  $('fin').hidden = false;
}

$('home').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b) start(+b.dataset.t, +b.dataset.l); });
$('back').addEventListener('click', home);
$('next').addEventListener('click', next);
$('fnext').addEventListener('click', () => start(G.t, G.l + 1));
$('fagain').addEventListener('click', () => start(G.t, G.l));
$('fhome').addEventListener('click', home);
$('ctl').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !G) return; const T = G.T, d = b.dataset;
  if (d.go) return go();
  if (d.tool) { T.tool = d.tool; T.sel = null; return render(); }
  if (d.undo) { T.objs.pop(); T.sel = null; say('', ''); return render(); }
  if (d.tip) { if (!T.tipped) { T.tipped = true; G.mistakes++; } say(typeof T.tip === 'function' ? T.tip(T) : T.tip, ''); return render(); }
  if (d.card) { T.sel = { t: T.sel.t, c: d.card }; return proofCheck(T); }
  if (d.d !== undefined) return key(d.d);
  if (d.f !== undefined) { G.af = +d.f; return render(); }
  if (d.o !== undefined && !T.ok) { const i = +d.o; if (i === T.right) return win(); T.off[i] = true; return miss('Das passt nicht. Schau noch einmal genau hin.'); }
  if (d.s !== undefined && !T.ok) {
    const i = +d.s;
    if (!T.steps[i].req.every(q => T.done.includes(q))) return miss('Das geht noch nicht. Was brauchst du vorher?');
    T.done.push(i); if (T.done.length === T.steps.length) return win();
    say('', ''); render();
  }
});
document.addEventListener('keydown', e => {
  if (!G || !G.T || !$('fin').hidden) return;
  if (e.key === 'Enter') { e.preventDefault(); return G.T.ok ? next() : G.T.type === 'con' ? 0 : go(); }
  if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('x');
});
const fig = $('fig'); let dragN = null;
const sp = e => { const r = fig.getBoundingClientRect(); return P(Math.max(8, Math.min(392, (e.clientX - r.left) / r.width * 400)), Math.max(8, Math.min(292, (e.clientY - r.top) / r.height * 300))); };
fig.addEventListener('pointerdown', e => {
  const T = G && G.T; if (!T || T.ok) return;
  const p = sp(e); let bd = 60; dragN = null;
  if (T.type === 'proof') { proofTap(T, p); return; }
  if (T.type === 'con') {
    let hd = 30, hit = null; cpts(T).forEach(q => { const d = dist(p, q); if (d < hd) { hd = d; hit = q; } });
    if (hit) { T.from = P(hit.x, hit.y); T.down = p; T.last = null; try { fig.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); }
    else if (T.sel) { T.sel = null; redraw(); }
    return;
  }
  if (T.type !== 'drag') return;
  for (const k in T.pts) { const d = dist(p, T.pts[k]); if (d < bd) { bd = d; dragN = k; } }
  if (dragN) { try { fig.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); }
});
fig.addEventListener('pointermove', e => {
  if (G && G.T && G.T.type === 'con') { if (G.T.from && !G.T.ok) { conMove(G.T, sp(e)); redraw(); } return; }
  if (!dragN || !G || G.T.ok) return; G.T.move(G.T, dragN, sp(e)); redraw(); });
const drop = () => { dragN = null; if (G && G.T && G.T.type === 'con' && G.T.from) conDrop(G.T); };
fig.addEventListener('pointerup', drop); fig.addEventListener('pointercancel', drop);
home();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
